[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strats-sdk"
version = "0.1.0"
description = "Shared data fetching and feature utils for trading strategies"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "requests",
    "ccxt",
    "pyarrow"
]

[project.optional-dependencies]
kafka = ["kafka-python>=3"]
rabbitmq = ["pika>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["strats_sdk*"]
